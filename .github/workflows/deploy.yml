name: Node.js CI/CD a EC2 (Despliegue Automático)

on:
  push:
    branches:
      - master 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇Checkout del código
      uses: actions/checkout@v4
      
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' 
        
    - name: INSTALAR DEPENDENCIAS 
      run: |
        # 1. Limpia la caché para evitar conflictos de módulos
        npm cache clean --force
        # 2. Elimina cualquier instalación antigua de node_modules
        rm -rf node_modules
        # 3. Instala dependencias (incluyendo devDependencies como mocha/chai)
        npm install

    - name: PERMITIR EJECUCIÓN DE PRUEBAS
      run: chmod +x node_modules/.bin/mocha
      
    - name: SUPERTEST
      run: npm run test
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    - name: Despliegue en EC2 y Clonación
      uses: appleboy/ssh-action@v1.0.3 
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }} 
        # ELIMINAR agent: true
        
        script: |
          # 1. Definir variables de ruta y repositorio
          APP_DIR="/home/${{ secrets.EC2_USER }}/node-backend"
          REPO_URL="git@github.com:${{ github.repository }}.git" 

          echo "Iniciando despliegue en el directorio: $APP_DIR"
          
          # 2. Lógica de Saneamiento y Clonación (USANDO LA CLAVE DIRECTA)
          mkdir -p $APP_DIR
          cd $APP_DIR

          if [ ! -d .git ]; then
            echo "WARN: Directorio no es un repo Git válido. Eliminando y clonando de nuevo..."
            # Eliminar todo el contenido si no es un repo válido
            rm -rf $APP_DIR/* $APP_DIR/.*
            
            # Clonar usando una URL HTTPS (si la clave SSH sigue fallando)
            # USAR CLONACIÓN HTTPS CON ACCESO SSH DE LA ACCIÓN
            git clone https://github.com/Leomont07/remedial.git .
            
            # NOTA: Si el SSH directo falla, HTTPS es el respaldo.
            # Pero en la mayoría de los casos, la clave directa funciona. 
            # Mantengamos el SSH por ahora:
            # git clone $REPO_URL . 
            
          else
            echo "Pulling latest changes..."
            git pull
          fi
          
          # 3. Construir y lanzar Docker
          echo "Deteniendo y removiendo contenedores previos..."
          docker compose down --remove-orphans
          
          echo "Construyendo nueva imagen Docker..."
          docker compose build
          
          echo "Lanzando nuevos contenedores..."
          docker compose up -d
          
          echo "Limpiando imágenes viejas para liberar espacio..."
          docker system prune -f
          
          echo "Despliegue de Node.js finalizado exitosamente."