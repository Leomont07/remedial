name: Node.js CI/CD a EC2 (Despliegue Automático)

on:
  # Se activa en cada push a la rama 'main'
  push:
    branches:
      - master 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout del código
      uses: actions/checkout@v4
      
    - name: 🛠️ Configurar Node.js (Ambiente de Pruebas)
      uses: actions/setup-node@v4
      with:
        node-version: '20' 
        
    - name: 📦 Instalar dependencias de desarrollo y producción
      run: |
        # 1. Limpia la caché para evitar conflictos de módulos
        npm cache clean --force
        # 2. Elimina cualquier instalación antigua de node_modules
        rm -rf node_modules
        # 3. Instala dependencias (incluyendo devDependencies como mocha/chai)
        npm install

    - name: 🔐 Forzar permisos de ejecución a binarios
      run: chmod +x node_modules/.bin/mocha
      
    - name: ✅ Ejecutar Pruebas de Integración (Supertest)
      # Esto fallará el pipeline si las pruebas no pasan
      run: npm run test
      env: # <-- AÑADIR ESTE BLOQUE
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    - name: 🚀 Despliegue en EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        # Variables de conexión, deben estar configuradas como Secrets en GitHub
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        
        script: |
          # 1. Definir variables de ruta y repositorio
          APP_DIR="/home/${{ secrets.EC2_USER }}/node-backend"
          # Usar la URL SSH para autenticación
          REPO_URL="git@github.com:${{ github.repository }}.git" 

          echo "Iniciando despliegue en el directorio: $APP_DIR"
          
          # 2. Clonar el repositorio si no existe
          if [ ! -d $APP_DIR ]; then
            echo "Directorio no encontrado. Clonando repositorio..."
            mkdir -p $APP_DIR
            # Clonación inicial usando la clave SSH
            git clone $REPO_URL $APP_DIR
          fi
          
          cd $APP_DIR
          
          # 3. Actualizar el código
          echo "Pulling latest changes..."
          git pull
          
          # 4. Detener y remover contenedores antiguos
          echo "Deteniendo y removiendo contenedores previos..."
          # Asume que docker-compose.yml del backend está en el repo
          docker compose down --remove-orphans
          
          # 5. Construir la nueva imagen
          echo "Construyendo nueva imagen Docker..."
          docker compose build
          
          # 6. Lanzar los nuevos contenedores en modo detached
          echo "Lanzando nuevos contenedores..."
          docker compose up -d
          
          # 7. Limpiar imágenes no utilizadas
          echo "Limpiando imágenes viejas para liberar espacio..."
          docker system prune -f
          
          echo "✅ Despliegue de Node.js finalizado exitosamente."