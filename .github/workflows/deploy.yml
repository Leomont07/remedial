name: Node.js CI/CD a EC2

on:
  push:
    branches:
      - main # Cambia a 'master' si usas esa rama

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout del código
      uses: actions/checkout@v4
      
    - name: 🛠️ Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Usa la versión de Node que necesites
        
    - name: 📦 Instalar dependencias
      run: npm install
      
    - name: ✅ Ejecutar Pruebas de Integración (Supertest)
      # Asume que tu script de pruebas en package.json es "test": "mocha test/*.test.js"
      run: npm test

    - name: 🚀 Despliegue en EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # El script de despliegue se ejecuta en el EC2
          APP_DIR="/home/${{ secrets.EC2_USER }}/node-backend"
          
          echo "Iniciando despliegue en $APP_DIR"
          
          # Clonar/Actualizar el código. Usa la clave SSH que configuramos en la EC2.
          if [ ! -d $APP_DIR ]; then
            git clone git@github.com:${{ github.repository }}.git $APP_DIR
          fi
          
          cd $APP_DIR
          git pull
          
          # Reconstruir la imagen y relanzar el contenedor
          # Esto requiere que Dockerfile y docker-compose.yml estén en el repo
          echo "Deteniendo y removiendo contenedores previos..."
          docker compose down --remove-orphans
          
          echo "Construyendo nueva imagen Docker..."
          docker compose build
          
          echo "Lanzando nuevos contenedores en modo detached..."
          docker compose up -d
          
          echo "Limpiando imágenes viejas..."
          docker system prune -f
          
          echo "Despliegue finalizado exitosamente."